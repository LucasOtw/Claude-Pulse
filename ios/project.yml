# Génère ClaudePulse.xcodeproj : ./setup.sh la première fois, puis ../update.sh (ou ./generate.sh).
# Fonctionne avec un Apple ID gratuit : pas de push, pas d'App Group, aucune capacité payante.
name: ClaudePulse
options:
  bundleIdPrefix: com.lucasotw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Ton équipe de signature (« Personal Team ») vit dans Local.xcconfig, écrit par generate.sh
# et ignoré par git : elle survit aux régénérations du projet.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ClaudePulse:
    type: application
    platform: iOS
    sources: [ClaudePulse, Shared]
    info:
      path: ClaudePulse/Info.plist
      properties:
        CFBundleDisplayName: Claude Pulse
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Le son silencieux garde l'app éveillée pour mettre à jour la Live Activity écran verrouillé.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasotw.claudepulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ClaudePulseWidgets

  ClaudePulseWidgets:
    type: app-extension
    platform: iOS
    sources: [ClaudePulseWidgets, Shared]
    info:
      path: ClaudePulseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Claude Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasotw.claudepulse.widgets
