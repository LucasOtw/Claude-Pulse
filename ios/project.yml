# Génère ClaudePulse.xcodeproj : lance ./setup.sh (ou `xcodegen` si Shared/PulseSecrets.swift existe déjà).
# Fonctionne avec un Apple ID gratuit : pas de push, pas d'App Group, aucune capacité payante.
name: ClaudePulse
options:
  bundleIdPrefix: com.lucasotw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Ton équipe (« Personal Team » avec un Apple ID gratuit) : choisis-la dans Xcode,
    # ou mets son identifiant ici pour ne pas avoir à la resélectionner après chaque xcodegen.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ClaudePulse:
    type: application
    platform: iOS
    sources: [ClaudePulse, Shared]
    info:
      path: ClaudePulse/Info.plist
      properties:
        CFBundleDisplayName: Claude Pulse
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Le son silencieux garde l'app éveillée pour mettre à jour la Live Activity écran verrouillé.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasotw.claudepulse
    dependencies:
      - target: ClaudePulseWidgets

  ClaudePulseWidgets:
    type: app-extension
    platform: iOS
    sources: [ClaudePulseWidgets, Shared]
    info:
      path: ClaudePulseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Claude Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasotw.claudepulse.widgets
