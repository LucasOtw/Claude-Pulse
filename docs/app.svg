<svg xmlns="http://www.w3.org/2000/svg" width="440" height="900" viewBox="0 0 440 900" role="img" aria-label="Écran d'accueil de Claude Pulse : limite 5 heures, limite 7 jours, surveillance active, session en cours">
  <title>Écran d'accueil de l'app</title>
  <defs>
    <clipPath id="screen"><rect x="22" y="22" width="396" height="856" rx="56"/></clipPath>
    <filter id="btn" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F7F3" stop-opacity="0"/>
      <stop offset="1" stop-color="#F8F7F3"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .serif { font-family: "New York", "Iowan Old Style", Georgia, "DejaVu Serif", serif; }
    .num { font-variant-numeric: tabular-nums; }
    .A1 { animation: A1 8s infinite; }
    .A2 { animation: A2 8s infinite; opacity: 0; }
    @keyframes A1 { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes A2 { 0%, 49% { opacity: 0 } 50%, 100% { opacity: 1 } }
    .s2 { animation: s2 8s infinite; }
    .s3 { animation: s3 8s infinite; }
    @keyframes s2 { 0%, 49% { opacity: .45 } 50%, 100% { opacity: 1 } }
    @keyframes s3 { 0%, 49% { opacity: 0 } 50%, 100% { opacity: .45 } }
    .t { opacity: 0; animation: tick 8s infinite; }
    @keyframes tick { 0%, 12.5% { opacity: 1 } 12.51%, 100% { opacity: 0 } }
    .d1 { animation-delay: 1s } .d2 { animation-delay: 2s } .d3 { animation-delay: 3s } .d4 { animation-delay: 4s } .d5 { animation-delay: 5s } .d6 { animation-delay: 6s } .d7 { animation-delay: 7s }
    .live { animation: live 1.6s ease-in-out infinite; transform-origin: 62px 492px; }
    @keyframes live { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.75) } }
    .ring { animation: ring 1.6s ease-out infinite; transform-origin: 62px 492px; }
    @keyframes ring { 0% { opacity: .5; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
  </style>

  <rect x="8" y="8" width="424" height="884" rx="68" fill="#1b1b1d"/>
  <rect x="10" y="10" width="420" height="880" rx="66" fill="none" stroke="#3a3a3e" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="22" y="22" width="396" height="856" fill="#F8F7F3"/>

    <!-- Barre d'état + Dynamic Island (Live Activity compacte) -->
    <text x="76" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#1F1E1C" class="num">14:29</text>
    <rect x="132" y="36" width="176" height="36" rx="18" fill="#000"/>
    <path d="M147 55 h4 l2-4 l3 9 l2.6-11 l2.2 6 h4" fill="none" stroke="#DE7356" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="13" font-weight="700" fill="#DE7356" text-anchor="end" class="num">
      <text x="294" y="59" class="t">4:12</text>
      <text x="294" y="59" class="t d1">4:11</text>
      <text x="294" y="59" class="t d2">4:10</text>
      <text x="294" y="59" class="t d3">4:09</text>
      <text x="294" y="59" class="t d4">4:08</text>
      <text x="294" y="59" class="t d5">4:07</text>
      <text x="294" y="59" class="t d6">4:06</text>
      <text x="294" y="59" class="t d7">4:05</text>
    </g>
    <g fill="#1F1E1C">
      <rect x="352" y="48" width="25" height="12" rx="3.5" fill="none" stroke="#1F1E1C" stroke-opacity=".4"/>
      <rect x="354" y="50" width="18" height="8" rx="2"/>
      <rect x="378.5" y="52" width="2" height="4" rx="1" opacity=".4"/>
      <path d="M326 60a10 10 0 0 1 16 0l-2.2 2.2a7 7 0 0 0-11.6 0z M329.5 63.5a5 5 0 0 1 9 0L334 68z"/>
    </g>

    <!-- En-tête : deux boutons de verre et le titre -->
    <g filter="url(#btn)">
      <circle cx="62" cy="108" r="22" fill="#fff"/>
      <circle cx="378" cy="108" r="22" fill="#fff"/>
    </g>
    <g stroke="#1F1E1C" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M53 103h18M53 113h18"/>
      <circle cx="58" cy="103" r="2.6" fill="#fff"/><circle cx="66" cy="113" r="2.6" fill="#fff"/>
      <path d="M385 106a7.5 7.5 0 1 1-2.6-6.2"/><path d="M383.5 95.5v4.8h-4.8"/>
    </g>
    <path d="M168 109 h4 l2-4 l3 9 l2.6-11 l2.2 6 h4" fill="none" stroke="#C15F3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="114" font-size="17" font-weight="600" fill="#1F1E1C">Claude Pulse</text>

    <!-- Limite 5 heures -->
    <rect x="38" y="144" width="364" height="182" rx="24" fill="#EFEDE7"/>
    <text x="56" y="198" font-size="46" font-weight="700" letter-spacing="-1" fill="#1F1E1C" class="num">42<tspan font-size="26" dx="4">%</tspan></text>
    <rect x="286" y="168" width="98" height="28" rx="14" fill="#2E9E5B" fill-opacity=".14"/>
    <text x="335" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#2E9E5B">Tranquille</text>
    <line x1="182" y1="232" x2="372" y2="232" stroke="#000" stroke-opacity=".12" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
    <circle cx="378" cy="232" r="4.5" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="3"/>
    <rect x="56" y="230" width="118" height="4" rx="2" fill="#2E9E5B">
      <animate attributeName="width" values="112;122;112" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" keyTimes="0;0.9;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="170" cy="232" r="13" fill="#EFEDE7"/>
      <circle cx="170" cy="232" r="11.75" fill="none" stroke="#2E9E5B" stroke-width="2.5"/>
      <path d="M163 232 h3 l1.6-3 l2.4 7 l2.2-9 l1.7 5 h3" fill="none" stroke="#2E9E5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="56" y="280" font-size="15" font-weight="500" fill="#1F1E1C">Limite 5 heures</text>
    <text x="368" y="280" text-anchor="end" font-size="15" fill="#6E6A62">Remise à zéro à 17:20</text>
    <path d="M378 274l4 4.5-4 4.5" fill="none" stroke="#9D988E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="304" r="5.5" fill="none" stroke="#9D988E" stroke-width="1.4"/>
    <path d="M61 301v3.2l2 1.4" fill="none" stroke="#9D988E" stroke-width="1.4" stroke-linecap="round"/>
    <text x="73" y="308" font-size="12" fill="#9D988E">Relevé à 14:28</text>

    <!-- 7 jours + sessions du jour -->
    <rect x="38" y="342" width="364" height="112" rx="22" fill="#EFEDE7"/>
    <rect x="54" y="358" width="24" height="22" rx="5" fill="none" stroke="#6E6A62" stroke-width="1.6"/>
    <path d="M54 364h24M60 355v5M72 355v5" stroke="#6E6A62" stroke-width="1.6" stroke-linecap="round"/>
    <text x="90" y="375" font-size="15" fill="#1F1E1C">Limite 7 jours</text>
    <text x="384" y="375" text-anchor="end" font-size="15" font-weight="600" fill="#C98A10" class="num">61 %</text>
    <rect x="90" y="386" width="294" height="4" rx="2" fill="#000" fill-opacity=".09"/>
    <rect x="90" y="386" width="179" height="4" rx="2" fill="#C98A10"/>
    <line x1="90" y1="404" x2="402" y2="404" stroke="#000" stroke-opacity=".08"/>
    <rect x="54" y="417" width="24" height="20" rx="5" fill="none" stroke="#6E6A62" stroke-width="1.6"/>
    <path d="M59 423l4 3.5-4 3.5M66 431h6" fill="none" stroke="#6E6A62" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="433" font-size="15" fill="#1F1E1C">Sessions aujourd'hui</text>
    <text x="384" y="433" text-anchor="end" font-size="15" font-weight="600" fill="#6E6A62">4</text>

    <!-- Surveillance -->
    <rect x="38" y="468" width="364" height="66" rx="22" fill="#EFEDE7"/>
    <circle class="ring" cx="62" cy="492" r="6" fill="#2E9E5B"/>
    <circle class="live" cx="62" cy="492" r="6" fill="#2E9E5B"/>
    <text x="78" y="497" font-size="15" font-weight="600" fill="#1F1E1C">Surveillance active</text>
    <text x="78" y="517" font-size="12" fill="#6E6A62">Mise à jour il y a 2 s</text>
    <rect x="300" y="484" width="86" height="34" rx="17" fill="#1F1E1C"/>
    <text x="343" y="506" text-anchor="middle" font-size="14" font-weight="600" fill="#F8F7F3">Arrêter</text>

    <!-- En cours -->
    <text x="42" y="568" font-size="15" font-weight="600" fill="#6E6A62">En cours</text>
    <rect x="38" y="580" width="364" height="206" rx="22" fill="#EFEDE7"/>
    <path d="M56 603l4.5 4-4.5 4M63 612h7" fill="none" stroke="#6E6A62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="613" font-size="15" font-weight="600" fill="#1F1E1C">Studio_Granit</text>
    <rect x="186" y="597" width="76" height="22" rx="11" fill="#C15F3C" fill-opacity=".13"/>
    <text x="224" y="612" text-anchor="middle" font-size="12" font-weight="600" fill="#C15F3C">En cours</text>
    <g font-size="15" fill="#6E6A62" text-anchor="end" class="num">
      <text x="384" y="613" class="t">12:04</text>
      <text x="384" y="613" class="t d1">12:05</text>
      <text x="384" y="613" class="t d2">12:06</text>
      <text x="384" y="613" class="t d3">12:07</text>
      <text x="384" y="613" class="t d4">12:08</text>
      <text x="384" y="613" class="t d5">12:09</text>
      <text x="384" y="613" class="t d6">12:10</text>
      <text x="384" y="613" class="t d7">12:11</text>
    </g>
    <text x="56" y="652" font-size="22" class="serif" fill="#1F1E1C"><tspan fill="#C15F3C">4 min</tspan> · fin vers 14:33</text>
    <text x="56" y="680" font-size="17" class="serif A1" fill="#1F1E1C">Modifie contact.html</text>
    <text x="56" y="680" font-size="17" class="serif A2" fill="#1F1E1C">Lance les tests du formulaire</text>
    <g>
      <rect x="56" y="696" width="61.6" height="5" rx="2.5" fill="#000" fill-opacity=".09"/><rect x="122.6" y="696" width="61.6" height="5" rx="2.5" fill="#000" fill-opacity=".09"/><rect x="189.2" y="696" width="61.6" height="5" rx="2.5" fill="#000" fill-opacity=".09"/><rect x="255.8" y="696" width="61.6" height="5" rx="2.5" fill="#000" fill-opacity=".09"/><rect x="322.4" y="696" width="61.6" height="5" rx="2.5" fill="#000" fill-opacity=".09"/>
      <rect x="56" y="696" width="61.6" height="5" rx="2.5" fill="#DE7356"/>
      <rect class="s2" x="122.6" y="696" width="61.6" height="5" rx="2.5" fill="#DE7356"/>
      <rect class="s3" x="189.2" y="696" width="61.6" height="5" rx="2.5" fill="#DE7356"/>
    </g>
    <g font-size="12">
      <text x="56" y="722" class="A1"><tspan font-weight="600" fill="#1F1E1C">Étape 2 sur 5</tspan><tspan fill="#6E6A62"> · Corriger le formulaire</tspan></text>
      <text x="56" y="722" class="A2"><tspan font-weight="600" fill="#1F1E1C">Étape 3 sur 5</tspan><tspan fill="#6E6A62"> · Lancer les tests</tspan></text>
    </g>
    <g font-size="12" fill="#6E6A62">
      <rect x="56" y="738" width="104" height="26" rx="13" fill="#E5E2DA"/><text x="108" y="755" text-anchor="middle">Contexte 42 %</text>
      <rect x="166" y="738" width="76" height="26" rx="13" fill="#E5E2DA"/><text x="204" y="755" text-anchor="middle">2 agents</text>
      <rect x="248" y="738" width="74" height="26" rx="13" fill="#E5E2DA"/><text x="285" y="755" text-anchor="middle">Opus 5.5</text>
    </g>
    <path d="M378 745l4 4.5-4 4.5" fill="none" stroke="#9D988E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Récentes -->
    <text x="42" y="814" font-size="15" font-weight="600" fill="#6E6A62">Récentes</text>
    <rect x="38" y="826" width="364" height="48" rx="18" fill="#EFEDE7"/>
    <circle cx="62" cy="850" r="9" fill="#2E9E5B" fill-opacity=".15"/>
    <path d="M58 850l3 3 5.5-6" fill="none" stroke="#2E9E5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="855" font-size="15" font-weight="500" fill="#1F1E1C">TomExplore</text>
    <text x="384" y="855" text-anchor="end" font-size="13" fill="#6E6A62">Terminé en 18 min</text>
    <rect x="22" y="846" width="396" height="32" fill="url(#fade)"/>
    <rect x="152" y="864" width="136" height="5" rx="2.5" fill="#1F1E1C" fill-opacity=".85"/>
  </g>
</svg>
