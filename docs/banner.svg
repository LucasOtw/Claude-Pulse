<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Claude Pulse : Claude Code, en direct sur ton iPhone">
  <title>Claude Pulse</title>
  <defs>
    <radialGradient id="bg" cx="78%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3a2219"/>
      <stop offset="0.45" stop-color="#1c1411"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#E8927A"/>
      <stop offset="1" stop-color="#C15F3C"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#E8927A"/>
      <stop offset="1" stop-color="#DE7356"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241713"/>
      <stop offset="1" stop-color="#0e0b0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="520" rx="28"/></clipPath>
    <path id="pulse" d="M760 330 H880 L920 268 L962 410 L1018 170 L1058 330 H1210"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4.2s cubic-bezier(.6,0,.2,1) infinite; }
    .trail { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4.2s cubic-bezier(.6,0,.2,1) infinite; opacity: .55; }
    @keyframes draw { 0% { stroke-dashoffset: 1000; opacity: 1 } 55% { stroke-dashoffset: 0; opacity: 1 } 80% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
    .halo { animation: halo 4.2s ease-in-out infinite; transform-origin: 1210px 330px; }
    @keyframes halo { 0%, 45% { opacity: 0; transform: scale(.6) } 60% { opacity: 1; transform: scale(1) } 80% { opacity: .8; transform: scale(1.15) } 100% { opacity: 0; transform: scale(1.3) } }
    .chip { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .c2 { animation-delay: .1s } .c3 { animation-delay: .2s } .c4 { animation-delay: .3s } .c5 { animation-delay: .4s }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="520" fill="url(#bg)"/>
    <rect width="1280" height="520" fill="url(#dots)"/>
    <ellipse cx="1000" cy="300" rx="260" ry="150" fill="#DE7356" opacity="0.10" filter="url(#soft)"/>

    <!-- Ligne de pouls -->
    <use xlink:href="#pulse" fill="none" stroke="#DE7356" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>
    <use xlink:href="#pulse" class="trail" fill="none" stroke="#DE7356" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <use xlink:href="#pulse" class="draw" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="halo">
      <circle cx="1210" cy="330" r="40" fill="#F5C9B8" opacity="0.25" filter="url(#soft)"/>
      <circle cx="1210" cy="330" r="22" fill="#FBD5C4"/>
      <circle cx="1210" cy="330" r="10" fill="#FFF8F2"/>
    </g>

    <!-- Icône -->
    <g transform="translate(96 92)">
      <rect width="76" height="76" rx="18" fill="url(#iconbg)" stroke="#ffffff" stroke-opacity="0.08"/>
      <path d="M12 44 H29 L35 35 L41 56 L49 20 L55 44 H64" fill="none" stroke="#DE7356" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="44" r="5" fill="#FBD5C4"/>
    </g>

    <!-- Titre -->
    <text x="92" y="262" font-size="92" font-weight="700" letter-spacing="-2.5" fill="#F4F2EC">Claude <tspan fill="url(#word)">Pulse</tspan></text>
    <text x="96" y="318" font-size="30" font-weight="500" fill="#B3AEA4">Claude Code, en direct sur ton iPhone.</text>

    <!-- Pastilles -->
    <g font-size="17" font-weight="600" fill="#E9E5DC">
      <g class="chip"><rect x="96" y="364" width="138" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="165" y="390" text-anchor="middle">Live Activity</text></g>
      <g class="chip c2"><rect x="246" y="364" width="164" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="328" y="390" text-anchor="middle">Dynamic Island</text></g>
      <g class="chip c3"><rect x="422" y="364" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="470" y="390" text-anchor="middle">Widget</text></g>
      <g class="chip c4"><rect x="530" y="364" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="605" y="390" text-anchor="middle">Notifications</text></g>
      <g class="chip c5"><rect x="692" y="364" width="78" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="731" y="390" text-anchor="middle">Siri</text></g>
    </g>

    <!-- Statut -->
    <g transform="translate(96 450)" font-size="16" fill="#7E796F">
      <circle class="blink" cx="6" cy="-5" r="5" fill="#5CD187"/>
      <text x="22" y="0">Usage · limites 5 h et 7 jours · tâches · sous-agents · workflows</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
