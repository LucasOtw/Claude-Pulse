<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Fonctionnement : le Mac envoie des métadonnées au serveur Vercel, l'iPhone l'interroge toutes les 5 secondes ; ntfy et la validation à distance en option">
  <title>Comment ça marche</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#231915"/>
      <stop offset="1" stop-color="#0e0c0b"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="470" rx="28"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="macToCloud" d="M318 186 H512"/>
    <path id="cloudToPhone" d="M688 186 H948"/>
    <path id="ntfy" d="M688 226 H760 V404 H1146 V200 H1052"/>
    <path id="approve" d="M1000 92 C 1000 30, 820 40, 600 40 C 380 40, 200 30, 200 104"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .flow { stroke-dasharray: 2 9; animation: flow 1s linear infinite; }
    .flow-back { stroke-dasharray: 2 9; animation: flow 1.2s linear infinite reverse; }
    @keyframes flow { to { stroke-dashoffset: -11 } }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0 } }
    .bar { animation: bar 6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes bar { 0% { transform: scaleX(.35) } 80%, 100% { transform: scaleX(1) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>

    <!-- Liaisons -->
    <use href="#macToCloud" fill="none" stroke="#DE7356" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round" class="flow"/>
    <use href="#cloudToPhone" fill="none" stroke="#DE7356" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round" class="flow"/>
    <use href="#ntfy" fill="none" stroke="#5CD187" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
    <use href="#approve" fill="none" stroke="#FAC24A" stroke-opacity=".40" stroke-width="2" stroke-linecap="round" class="flow-back"/>

    <!-- Paquets -->
    <g filter="url(#glow)">
      <circle r="5" fill="#E8927A"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#macToCloud"/></animateMotion></circle>
      <circle r="5" fill="#E8927A"><animateMotion dur="2.2s" repeatCount="indefinite" begin="-1.1s"><mpath href="#macToCloud"/></animateMotion></circle>
      <circle r="5" fill="#E8927A"><animateMotion dur="2.6s" repeatCount="indefinite" begin="-0.4s"><mpath href="#cloudToPhone"/></animateMotion></circle>
      <circle r="5" fill="#E8927A"><animateMotion dur="2.6s" repeatCount="indefinite" begin="-1.7s"><mpath href="#cloudToPhone"/></animateMotion></circle>
      <circle r="4.5" fill="#5CD187"><animateMotion dur="4.5s" repeatCount="indefinite" begin="-1s"><mpath href="#ntfy"/></animateMotion></circle>
      <circle r="4.5" fill="#FAC24A"><animateMotion dur="5s" repeatCount="indefinite" begin="-2s"><mpath href="#approve"/></animateMotion></circle>
    </g>

    <!-- Libellés des liaisons -->
    <g font-size="14" fill="#B3AEA4" text-anchor="middle">
      <text x="415" y="172">événements + usage</text>
      <text x="818" y="172">relevé toutes les 5 s</text>
      <text x="953" y="432" fill="#5CD187" fill-opacity=".85">ntfy · notifications même app fermée (option)</text>
      <text x="600" y="28" fill="#FAC24A" fill-opacity=".85">Autoriser / Refuser depuis l'iPhone (option)</text>
    </g>

    <!-- Mac -->
    <g>
      <rect x="104" y="104" width="192" height="128" rx="12" fill="#151210" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
      <circle cx="120" cy="118" r="3.5" fill="#F0544F"/><circle cx="132" cy="118" r="3.5" fill="#FAC24A"/><circle cx="144" cy="118" r="3.5" fill="#5CD187"/>
      <text x="120" y="148" font-size="13" class="mono" fill="#DE7356">❯ <tspan fill="#E9E5DC">claude</tspan></text>
      <text x="120" y="170" font-size="11" class="mono" fill="#7E796F">● Modifie contact.html</text>
      <text x="120" y="188" font-size="11" class="mono" fill="#7E796F">● npm test</text>
      <rect x="120" y="198" width="7" height="13" fill="#DE7356" class="cursor"/>
      <path d="M86 232 H314 L304 246 H96 Z" fill="#26221f" stroke="#fff" stroke-opacity=".12"/>
      <text x="200" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F2EC">Ton Mac</text>
      <text x="200" y="344" text-anchor="middle" font-size="14" fill="#B3AEA4">Claude Code · hooks · status line</text>
      <text x="200" y="366" text-anchor="middle" font-size="13" fill="#7E796F">métadonnées seulement</text>
    </g>

    <!-- Serveur -->
    <g>
      <rect x="512" y="122" width="176" height="128" rx="26" fill="#1d1613" stroke="#DE7356" stroke-opacity=".45" stroke-width="2"/>
      <path d="M560 172 l14 -24 l14 24 z" fill="#F4F2EC"/>
      <text x="600" y="168" font-size="15" font-weight="700" fill="#F4F2EC">Vercel</text>
      <rect x="548" y="190" width="104" height="30" rx="8" fill="#5CD187" fill-opacity=".12" stroke="#5CD187" stroke-opacity=".35"/>
      <text x="600" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#5CD187">Upstash Redis</text>
      <text x="600" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F2EC">Serveur</text>
      <text x="600" y="344" text-anchor="middle" font-size="14" fill="#B3AEA4">état en direct de tes sessions</text>
      <text x="600" y="366" text-anchor="middle" font-size="13" fill="#7E796F">plans gratuits</text>
    </g>

    <!-- iPhone -->
    <g>
      <rect x="950" y="92" width="100" height="200" rx="22" fill="#0b1430" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
      <rect x="983" y="100" width="34" height="10" rx="5" fill="#000"/>
      <text x="1000" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" fill-opacity=".9">14:29</text>
      <rect x="958" y="148" width="84" height="56" rx="12" fill="#000"/>
      <path d="M965 160 h3 l1.5-3 l2 6 l2-8 l1.5 5 h3" fill="none" stroke="#DE7356" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="965" y="170" width="56" height="5" rx="2.5" fill="#fff" fill-opacity=".85"/>
      <rect x="965" y="180" width="40" height="4" rx="2" fill="#fff" fill-opacity=".35"/>
      <rect x="965" y="192" width="70" height="3" rx="1.5" fill="#fff" fill-opacity=".14"/>
      <rect x="965" y="192" width="70" height="3" rx="1.5" fill="#5CD187" class="bar"/>
      <text x="1000" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F2EC">Ton iPhone</text>
      <text x="1000" y="344" text-anchor="middle" font-size="14" fill="#B3AEA4">Live Activity · widget · Siri</text>
      <text x="1000" y="366" text-anchor="middle" font-size="13" fill="#7E796F">aucun compte payant</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
